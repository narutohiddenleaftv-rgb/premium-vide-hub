<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Portal</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 600px;
      background: #1e293b;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      margin-bottom: 20px;
    }
    h2, h3 {
      text-align: center;
      margin-bottom: 16px;
      color: #38bdf8;
    }
    .input-group {
      margin-bottom: 14px;
    }
    input[type="password"], input[type="text"] {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: white;
      font-size: 15px;
      outline: none;
    }
    input:focus {
      border-color: #38bdf8;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background: #1d4ed8;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 1px solid #334155;
      padding-bottom: 10px;
    }
    .badge {
      background: #0284c7;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
    }
    .logout-btn {
      width: auto;
      padding: 6px 14px;
      background: #ef4444;
      font-size: 13px;
    }
    .upload-zone {
      border: 2px dashed #475569;
      border-radius: 8px;
      padding: 18px;
      text-align: center;
      margin-bottom: 16px;
      background: #182234;
    }
    .file-btn {
      display: inline-block;
      margin-top: 10px;
      background: #0284c7;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
    }
    input[type="file"] {
      display: none;
    }
    #progressStatus {
      margin-top: 10px;
      font-size: 13px;
      color: #38bdf8;
      font-weight: 500;
    }
    .divider {
      text-align: center;
      margin: 14px 0;
      color: #64748b;
      font-size: 13px;
      position: relative;
    }
    .video-card {
      background: #0f172a;
      border-radius: 10px;
      overflow: hidden;
      margin-top: 16px;
      border: 1px solid #334155;
      padding: 10px;
    }
    video {
      width: 100%;
      border-radius: 6px;
      display: block;
      background: #000;
    }
    .video-info {
      padding: 10px 4px 4px 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .video-title {
      font-size: 14px;
      font-weight: 600;
      color: #e2e8f0;
      word-break: break-word;
    }
    .del-btn {
      width: auto;
      padding: 4px 8px;
      background: #7f1d1d;
      font-size: 11px;
      border-radius: 4px;
    }
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <!-- লগইন বক্স -->
  <div class="card" id="loginCard">
    <h2>ভিডিও পোর্টালে প্রবেশ</h2>
    <div class="input-group">
      <input type="password" id="secretCodeInput" placeholder="আপনার অ্যাক্সেস কোড দিন...">
    </div>
    <button type="button" id="loginBtn">লগইন</button>
    <p id="loginError" style="color: #f87171; text-align: center; font-size: 13px; margin-top: 10px;"></p>
  </div>

  <!-- ড্যাশবোর্ড -->
  <div class="card hidden" id="mainDashboard">
    <div class="top-bar">
      <div>
        <strong id="userDisplayName"></strong>
        <span class="badge" id="roleBadge"></span>
      </div>
      <button type="button" class="logout-btn" id="logoutBtn">লগআউট</button>
    </div>

    <!-- আপলোড সেকশন (শুধু mahabub06 দেখতে পাবে) -->
    <div id="uploadContainer" class="hidden">
      <div class="upload-zone">
        <p style="font-size: 15px; font-weight: bold;">২০০MB+ ভিডিও ফাইল আপলোড</p>
        <label class="file-btn" for="videoFile">গ্যালারি থেকে ভিডিও বাছুন</label>
        <input type="file" id="videoFile" accept="video/*">

        <div class="divider">— অথবা ভিডিও লিংক দিন —</div>

        <div style="display: flex; gap: 8px;">
          <input type="text" id="videoUrlInput" placeholder="ভিডিওর ডিরেক্ট লিংক (URL) দিন...">
          <button type="button" id="addUrlBtn" style="width: 80px; padding: 10px; font-size: 14px;">যুক্ত</button>
        </div>

        <div id="progressStatus">কোনো ভিডিও প্রসেসিং হচ্ছে না</div>
      </div>
    </div>

    <!-- ভিডিও তালিকা -->
    <h3>ভিডিও ফিড</h3>
    <div id="videoList"></div>
  </div>

  <script>
    var USERS = {
      "mahabub06": { role: "admin", label: "Admin Mode (Upload + Watch)" },
      "premium06": { role: "viewer", label: "Viewer Mode (Watch Only)" }
    };

    var currentUser = null;
    var db = null;

    // IndexedDB সেটআপ (২০০MB+ ফাইল স্টোর করার জন্য)
    var request = indexedDB.open("VideoPortalDB", 1);
    request.onupgradeneeded = function(e) {
      db = e.target.result;
      if (!db.objectStoreNames.contains("videos")) {
        db.createObjectStore("videos", { keyPath: "id", autoIncrement: true });
      }
    };
    request.onsuccess = function(e) {
      db = e.target.result;
    };

    var loginCard = document.getElementById('loginCard');
    var mainDashboard = document.getElementById('mainDashboard');
    var secretCodeInput = document.getElementById('secretCodeInput');
    var loginBtn = document.getElementById('loginBtn');
    var loginError = document.getElementById('loginError');
    var logoutBtn = document.getElementById('logoutBtn');
    var userDisplayName = document.getElementById('userDisplayName');
    var roleBadge = document.getElementById('roleBadge');
    var uploadContainer = document.getElementById('uploadContainer');
    var videoFile = document.getElementById('videoFile');
    var videoUrlInput = document.getElementById('videoUrlInput');
    var addUrlBtn = document.getElementById('addUrlBtn');
    var progressStatus = document.getElementById('progressStatus');
    var videoList = document.getElementById('videoList');

    // লগইন বাটন
    loginBtn.onclick = function() {
      var code = secretCodeInput.value.trim().toLowerCase();

      if (USERS[code]) {
        currentUser = { username: code, role: USERS[code].role, label: USERS[code].label };
        loginError.innerText = "";
        secretCodeInput.value = "";
        
        loginCard.classList.add('hidden');
        mainDashboard.classList.remove('hidden');

        userDisplayName.innerText = currentUser.username;
        roleBadge.innerText = currentUser.label;

        // রোল ফিল্টারিং
        if (currentUser.role === 'admin') {
          uploadContainer.classList.remove('hidden');
        } else {
          uploadContainer.classList.add('hidden');
        }

        renderVideos();
      } else {
        loginError.innerText = "ভুল অ্যাক্সেস কোড!";
      }
    };

    secretCodeInput.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') loginBtn.click();
    });

    logoutBtn.onclick = function() {
      currentUser = null;
      mainDashboard.classList.add('hidden');
      loginCard.classList.remove('hidden');
    };

    // বড় সাইজের ভিডিও ফাইল সেভ করা (Blob আকারে IndexedDB-তে)
    videoFile.onchange = function(e) {
      if (!currentUser || currentUser.role !== 'admin') return;

      var file = e.target.files[0];
      if (!file) return;

      var sizeMB = (file.size / (1024 * 1024)).toFixed(1);
      progressStatus.innerText = "ভিডিও লোড হচ্ছে (" + sizeMB + " MB)... অনুগ্রহ করে অপেক্ষা করুন";

      var tx = db.transaction(["videos"], "readwrite");
      var store = tx.objectStore("videos");

      var item = {
        title: file.name,
        type: "blob",
        data: file, // সরাসরি ফাইল অবজেক্ট সেভ হবে
        timestamp: Date.now()
      };

      var addReq = store.add(item);
      addReq.onsuccess = function() {
        progressStatus.innerText = "ভিডিও সফলভাবে যুক্ত হয়েছে! (" + sizeMB + " MB)";
        videoFile.value = "";
        renderVideos();
      };
      addReq.onerror = function() {
        progressStatus.innerText = "ভিডিও সেভ হতে সমস্যা হয়েছে।";
      };
    };

    // লিংক দিয়ে ভিডিও যুক্ত করা
    addUrlBtn.onclick = function() {
      if (!currentUser || currentUser.role !== 'admin') return;
      var url = videoUrlInput.value.trim();
      if (!url) return;

      var tx = db.transaction(["videos"], "readwrite");
      var store = tx.objectStore("videos");

      var item = {
        title: "Online Video (" + new Date().toLocaleTimeString() + ")",
        type: "url",
        data: url,
        timestamp: Date.now()
      };

      store.add(item).onsuccess = function() {
        videoUrlInput.value = "";
        progressStatus.innerText = "ভিডিও লিংক যুক্ত হয়েছে!";
        renderVideos();
      };
    };

    // ভিডিও দেখানো
    function renderVideos() {
      if (!db) {
        setTimeout(renderVideos, 200);
        return;
      }

      videoList.innerHTML = "";
      var tx = db.transaction(["videos"], "readonly");
      var store = tx.objectStore("videos");
      var getAllReq = store.getAll();

      getAllReq.onsuccess = function() {
        var videos = getAllReq.result;

        if (!videos || videos.length === 0) {
          videoList.innerHTML = '<p style="text-align:center; color:#64748b;">কোনো ভিডিও নেই।</p>';
          return;
        }

        // নতুন ভিডিও আগে দেখাবে
        videos.reverse();

        videos.forEach(function(item) {
          var card = document.createElement('div');
          card.className = 'video-card';

          var videoSrc = "";
          if (item.type === "blob") {
            videoSrc = URL.createObjectURL(item.data); // মেমোরি নষ্ট না করে সরাসরি স্ট্রিম
          } else {
            videoSrc = item.data;
          }

          var deleteButtonHtml = "";
          if (currentUser && currentUser.role === 'admin') {
            deleteButtonHtml = '<button class="del-btn" onclick="deleteVideo(' + item.id + ')">মুছুন</button>';
          }

          card.innerHTML = 
            '<video controls preload="metadata" src="' + videoSrc + '"></video>' +
            '<div class="video-info">' +
              '<span class="video-title">' + item.title + '</span>' +
              deleteButtonHtml +
            '</div>';

          videoList.appendChild(card);
        });
      };
    }

    // ভিডিও মোছার ফাংশন (শুধু admin)
    window.deleteVideo = function(id) {
      if (!currentUser || currentUser.role !== 'admin') return;
      var tx = db.transaction(["videos"], "readwrite");
      tx.objectStore("videos").delete(id).onsuccess = function() {
        renderVideos();
      };
    };
  </script>
</body>
</html>
